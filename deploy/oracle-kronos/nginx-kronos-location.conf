# Site-root /favicon.ico is the browser default (not /kronos/). Serve the
# Kronos icon from disk so a dead catch-all proxy can no longer 502 it.
# If nginx -t fails with a duplicate location, remove the other
# `location = /favicon.ico` from the main server config so this one can own it.
location = /favicon.ico {
    alias /opt/kronos-web/webui/static/favicon.ico;
    access_log off;
    log_not_found off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    default_type image/vnd.microsoft.icon;
}

location = /apple-touch-icon.png {
    alias /opt/kronos-web/webui/static/apple-touch-icon.png;
    access_log off;
    log_not_found off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    default_type image/png;
}

location = /apple-touch-icon-precomposed.png {
    alias /opt/kronos-web/webui/static/apple-touch-icon.png;
    access_log off;
    log_not_found off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    default_type image/png;
}

location = /kronos/favicon.ico {
    alias /opt/kronos-web/webui/static/favicon.ico;
    access_log off;
    log_not_found off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    default_type image/vnd.microsoft.icon;
}

location ^~ /kronos/static/ {
    alias /opt/kronos-web/webui/static/;
    access_log off;
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}

# PWA install files must stay outside any cookie/auth wall. Exact locations
# serve them from disk so gunicorn being down cannot 502 the worker script.
location = /kronos/sw.js {
    alias /opt/kronos-web/webui/static/sw.js;
    access_log off;
    default_type application/javascript;
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/kronos/";
}

location = /kronos/manifest.webmanifest {
    alias /opt/kronos-web/webui/static/manifest.webmanifest;
    access_log off;
    expires 1h;
    default_type application/manifest+json;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
}

location = /kronos {
    return 301 /kronos/;
}

location ^~ /kronos/ {
    proxy_pass http://127.0.0.1:7072/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /kronos;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
